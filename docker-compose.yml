services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - sqlite_data:/var/www/database
      - storage_data:/var/www/storage
      - build_assets:/var/www/public/build
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - SESSION_DRIVER=database

  web:
    image: nginx:alpine
    container_name: pos_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - build_assets:/var/www/public/build
    depends_on:
      - app

volumes:
  sqlite_data:
  storage_data:
  build_assets: